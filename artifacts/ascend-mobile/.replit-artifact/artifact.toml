kind = "mobile"
previewPath = "/ascend-mobile/"
title = "Ascend Fit — iOS App"
version = "1.0.0"
id = "artifacts/ascend-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/ascend-mobile/" ]
localPort = 21494

[services.development]
run = "pnpm --filter @workspace/ascend-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ascend-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ascend-mobile", "run", "serve" ]

[services.env]
PORT = "21494"
BASE_PATH = "/ascend-mobile/"
