kind = "web"
previewPath = "/"
title = "Project Upgrade"
version = "1.0.0"
id = "artifacts/project-upgrade"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22808

[services.development]
run = "pnpm --filter @workspace/project-upgrade run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/project-upgrade", "run", "build" ]
publicDir = "artifacts/project-upgrade/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22808"
BASE_PATH = "/"
