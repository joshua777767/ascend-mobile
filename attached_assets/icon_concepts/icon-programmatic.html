<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #020B1F; margin: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
    .icon-container { text-align: center; }
    .icon-container h3 { color: #F59E0B; font-family: sans-serif; font-size: 14px; margin: 10px 0 0; }
  </style>
</head>
<body>

<!-- Concept A: Bold Geometric Upward Arrow -->
<div class="icon-container">
  <svg width="400" height="400" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <rect width="1024" height="1024" fill="#020B1F"/>
    <!-- Main arrow shape - bold, geometric, upward -->
    <polygon points="512,180 280,700 420,700 420,580 604,580 604,700 744,700" fill="#0EA5E9"/>
    <!-- Inner highlight for depth -->
    <polygon points="512,220 340,650 440,650 440,560 584,560 584,650 684,650" fill="#38BDF8" opacity="0.5"/>
    <!-- Gold accent at the tip -->
    <polygon points="512,180 480,250 544,250" fill="#F59E0B"/>
  </svg>
  <h3>A: Bold Upward Arrow</h3>
</div>

<!-- Concept B: Double Ascent (two peaks) -->
<div class="icon-container">
  <svg width="400" height="400" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <rect width="1024" height="1024" fill="#020B1F"/>
    <!-- Outer triangle/peak -->
    <polygon points="512,200 240,720 784,720" fill="none" stroke="#0EA5E9" stroke-width="80" stroke-linejoin="round"/>
    <!-- Inner smaller peak -->
    <polygon points="512,380 360,650 664,650" fill="none" stroke="#38BDF8" stroke-width="50" stroke-linejoin="round"/>
    <!-- Gold dot at apex -->
    <circle cx="512" cy="200" r="30" fill="#F59E0B"/>
  </svg>
  <h3>B: Double Peak (Growth Rings)</h3>
</div>

<!-- Concept C: Rising Trajectory Line -->
<div class="icon-container">
  <svg width="400" height="400" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <rect width="1024" height="1024" fill="#020B1F"/>
    <!-- Background subtle grid -->
    <line x1="200" y1="800" x2="800" y2="800" stroke="#0B1A3A" stroke-width="4"/>
    <line x1="200" y1="800" x2="200" y2="400" stroke="#0B1A3A" stroke-width="4"/>
    <!-- The rising trajectory path -->
    <path d="M 200 750 Q 400 650, 500 500 T 700 280 L 750 330" fill="none" stroke="#0EA5E9" stroke-width="60" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="750,330 650,360 680,400" fill="#F59E0B"/>
    <!-- Glow dot at current point -->
    <circle cx="700" cy="280" r="25" fill="#F59E0B"/>
  </svg>
  <h3>C: Rising Trajectory</h3>
</div>

<!-- Concept D: Geometric Diamond/Peak -->
<div class="icon-container">
  <svg width="400" height="400" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <rect width="1024" height="1024" fill="#020B1F"/>
    <!-- Main diamond shape -->
    <polygon points="512,180 180,512 512,844 844,512" fill="none" stroke="#0EA5E9" stroke-width="70" stroke-linejoin="round"/>
    <!-- Inner upward arrow formed by negative space -->
    <polygon points="512,320 380,580 644,580" fill="#0EA5E9" opacity="0.9"/>
    <!-- Gold accent -->
    <polygon points="512,180 480,240 544,240" fill="#F59E0B"/>
    <!-- Inner glow -->
    <circle cx="512" cy="512" r="80" fill="#0EA5E9" opacity="0.15"/>
  </svg>
  <h3>D: Geometric Diamond</h3>
</div>

<!-- Concept E: Minimal Progress Bar/Steps -->
<div class="icon-container">
  <svg width="400" height="400" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <rect width="1024" height="1024" fill="#020B1F"/>
    <!-- Three ascending bars -->
    <rect x="280" y="720" width="120" height="120" rx="20" fill="#0B1A3A"/>
    <rect x="452" y="600" width="120" height="240" rx="20" fill="#1E3A5F"/>
    <rect x="624" y="480" width="120" height="360" rx="20" fill="#0EA5E9"/>
    <!-- Gold indicator on top bar -->
    <circle cx="684" cy="460" r="25" fill="#F59E0B"/>
    <!-- Connecting line showing progression -->
    <path d="M 340 720 L 512 600 L 684 480" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-dasharray="20 15"/>
  </svg>
  <h3>E: Progress Steps</h3>
</div>

<!-- Concept F: Shield/Armor with Upward Element -->
<div class="icon-container">
  <svg width="400" height="400" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <rect width="1024" height="1024" fill="#020B1F"/>
    <!-- Shield shape -->
    <path d="M 512 180 L 200 340 L 200 560 Q 200 760 512 880 Q 824 760 824 560 L 824 340 Z" fill="#0B1A3A" stroke="#0EA5E9" stroke-width="40" stroke-linejoin="round"/>
    <!-- Inner upward arrow -->
    <polygon points="512,380 420,580 604,580" fill="#0EA5E9"/>
    <rect x="472" y="580" width="80" height="160" rx="10" fill="#0EA5E9"/>
    <!-- Gold tip -->
    <polygon points="512,380 490,420 534,420" fill="#F59E0B"/>
  </svg>
  <h3>F: Shield + Arrow</h3>
</div>

</body>
</html>
