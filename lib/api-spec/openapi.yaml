openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Ascend API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and onboarding
  - name: plans
    description: Personalized fitness plans
  - name: workouts
    description: Workout sessions and exercises
  - name: meals
    description: Meal check-ins and feedback
  - name: journal
    description: Nightly journal entries
  - name: reviews
    description: Daily coach reviews
  - name: weigh-ins
    description: Weekly weigh-ins and adjustments
  - name: schedule
    description: Daily schedule
  - name: chat
    description: AI coach chat
  - name: progress
    description: Progress tracking
  - name: streak
    description: Daily streak tracking
  - name: water
    description: Water intake tracking
  - name: goal-checkins
    description: Goal-specific weekly check-ins
  - name: stripe
    description: Stripe subscriptions and billing

paths:
  /stripe/subscription:
    get:
      operationId: getSubscription
      tags: [stripe]
      summary: Get current subscription status
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"

  /stripe/checkout:
    post:
      operationId: createCheckout
      tags: [stripe]
      summary: Create Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri

  /stripe/portal:
    post:
      operationId: createPortal
      tags: [stripe]
      summary: Create Stripe customer portal session
      responses:
        "200":
          description: Portal session URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri

  /stripe/products:
    get:
      operationId: getProducts
      tags: [stripe]
      summary: List Stripe products with prices
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StripeProduct"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createUserProfile
      tags: [users]
      summary: Create or update user profile (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateUserProfile
      tags: [users]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    delete:
      operationId: resetUserProfile
      tags: [users]
      summary: Reset (delete) the current user's profile and all their data
      responses:
        "204":
          description: Reset complete

  /users/profile/goal:
    patch:
      operationId: updateGoal
      tags: [users]
      summary: Update goal weight and reset goal tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Always returns same safe message regardless of whether email exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current user
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /plans/current:
    get:
      operationId: getCurrentPlan
      tags: [plans]
      summary: Get current personalized plan
      responses:
        "200":
          description: Current plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: generatePlan
      tags: [plans]
      summary: Generate a personalized plan based on user profile
      responses:
        "201":
          description: Generated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /workouts:
    get:
      operationId: listWorkouts
      tags: [workouts]
      summary: List all workout sessions
      responses:
        "200":
          description: List of workouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workout"
    post:
      operationId: createWorkout
      tags: [workouts]
      summary: Log a completed workout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"

  /workouts/today:
    get:
      operationId: getTodayWorkout
      tags: [workouts]
      summary: Get today's planned workout
      responses:
        "200":
          description: Today's workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedWorkout"

  /workouts/{id}/complete:
    patch:
      operationId: completeWorkout
      tags: [workouts]
      summary: Mark workout as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"

  /meals:
    get:
      operationId: listMeals
      tags: [meals]
      summary: List meal check-ins
      responses:
        "200":
          description: List of meal check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meal"
    post:
      operationId: createMeal
      tags: [meals]
      summary: Log a meal and get coach feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealInput"
      responses:
        "201":
          description: Created with coach feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"

  /meals/today:
    get:
      operationId: getTodayMeals
      tags: [meals]
      summary: Get today's meal check-ins
      responses:
        "200":
          description: Today's meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meal"

  /meals/generate:
    post:
      operationId: generateMeals
      tags: [meals]
      summary: Generate meal options with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealGeneratorInput"
      responses:
        "200":
          description: Generated meal options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealGeneratorResult"

  /journal:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List nightly journal entries
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Submit a nightly journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal/today:
    get:
      operationId: getTodayJournalEntry
      tags: [journal]
      summary: Get today's journal entry
      responses:
        "200":
          description: Today's journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List daily coach reviews
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachReview"
    post:
      operationId: generateReview
      tags: [reviews]
      summary: Generate today's daily coach review
      responses:
        "201":
          description: Generated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachReview"

  /reviews/today:
    get:
      operationId: getTodayReview
      tags: [reviews]
      summary: Get today's coach review
      responses:
        "200":
          description: Today's review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachReview"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /weigh-ins:
    get:
      operationId: listWeighIns
      tags: [weigh-ins]
      summary: List weekly weigh-ins
      responses:
        "200":
          description: List of weigh-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeighIn"
    post:
      operationId: createWeighIn
      tags: [weigh-ins]
      summary: Submit weekly weigh-in and get adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeighInInput"
      responses:
        "201":
          description: Created with adjustment plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighIn"

  /schedule/today:
    get:
      operationId: getTodaySchedule
      tags: [schedule]
      summary: Get today's daily schedule
      responses:
        "200":
          description: Today's schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySchedule"
    patch:
      operationId: updateScheduleItem
      tags: [schedule]
      summary: Update a schedule item's time or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleInput"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySchedule"

  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the AI coach and get a response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Coach response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /chat/history:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Get recent chat history
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"

  /progress/summary:
    get:
      operationId: getProgressSummary
      tags: [progress]
      summary: Get overall progress summary for dashboard
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

  /progress/streak:
    get:
      operationId: getMissionStreak
      tags: [progress]
      summary: Get current mission streak
      responses:
        "200":
          description: Mission streak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionStreak"

  /progress/weekly-recap:
    get:
      operationId: getWeeklyRecap
      tags: [progress]
      summary: Get last 7 days recap — meals, journals, weight, streak
      responses:
        "200":
          description: Weekly recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyRecap"

  /progress/milestones:
    get:
      operationId: getMilestones
      tags: [progress]
      summary: Get unlocked milestones for the user
      responses:
        "200":
          description: Milestones list
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestones:
                    type: array
                    items:
                      $ref: "#/components/schemas/Milestone"

  /streak:
    get:
      operationId: getStreak
      tags: [streak]
      summary: Get current Ascend streak
      responses:
        "200":
          description: Streak data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AscendStreak"
        "401":
          description: Unauthorized
    post:
      operationId: recordStreak
      tags: [streak]
      summary: Record a streak for today
      responses:
        "200":
          description: Updated streak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AscendStreak"
        "401":
          description: Unauthorized

  /water/today:
    get:
      operationId: getWaterToday
      tags: [water]
      summary: Get today's water intake total and target
      responses:
        "200":
          description: Today's water summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterSummary"
        "401":
          description: Unauthorized

  /water:
    post:
      operationId: logWater
      tags: [water]
      summary: Log water intake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogWaterInput"
      responses:
        "201":
          description: Updated water summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterSummary"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /goal-checkins:
    get:
      operationId: listGoalCheckIns
      tags: [goal-checkins]
      summary: Get all goal check-ins for current user
      responses:
        "200":
          description: List of goal check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalCheckIn"
        "401":
          description: Unauthorized
    post:
      operationId: createGoalCheckIn
      tags: [goal-checkins]
      summary: Submit weekly goal check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCheckInInput"
      responses:
        "201":
          description: Check-in created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalCheckIn"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
      required:
        - id
        - email

    SignupInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ForgotPasswordInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    ResetPasswordInput:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
      required:
        - token
        - password

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    UserProfile:
      type: object
      required:
        - id
        - name
        - age
        - gender
        - heightCm
        - currentWeightKg
        - goalWeightKg
        - bodyType
        - goals
        - fitnessLevel
        - gymAccess
        - workoutDaysPerWeek
        - wakeTime
        - sleepTime
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
        heightCm:
          type: number
        currentWeightKg:
          type: number
        goalWeightKg:
          type: number
        bodyType:
          type: string
        goals:
          type: array
          items:
            type: string
        targetDate:
          type: ["string", "null"]
        fitnessLevel:
          type: string
        gymAccess:
          type: string
        equipment:
          type: ["string", "null"]
        workoutDaysPerWeek:
          type: integer
        preferredWorkoutTime:
          type: ["string", "null"]
        wakeTime:
          type: string
        sleepTime:
          type: string
        sleepQuality:
          type: integer
        energyLevel:
          type: integer
        stressLevel:
          type: integer
        workSchedule:
          type: ["string", "null"]
        averageDailySteps:
          type: ["integer", "null"]
        allergies:
          type: ["string", "null"]
        dislikedFoods:
          type: ["string", "null"]
        dietStyle:
          type: ["string", "null"]
        foodBudget:
          type: ["string", "null"]
        mealsPerDay:
          type: integer
        waterIntakeLiters:
          type: number
        caffeineUse:
          type: ["string", "null"]
        screenTimeBeforeBed:
          type: ["string", "null"]
        skinConcerns:
          type: array
          items:
            type: string
        digestionConcerns:
          type: array
          items:
            type: string
        biggestStruggle:
          type: ["string", "null"]
        sport:
          type: ["string", "null"]
        sportCustom:
          type: ["string", "null"]
        sportSchedule:
          type: ["string", "null"]
        hasOwnSchedule:
          type: ["string", "null"]
        ownSchedule:
          type: ["string", "null"]
        customWorkoutSchedule:
          type: ["string", "null"]
        workoutFocus:
          type: ["string", "null"]
        commitmentLevel:
          type: ["string", "null"]
          enum: ["casual", "serious", "locked_in", "extreme_discipline"]
        wakeTimeRange:
          type: ["string", "null"]
        sleepTimeRange:
          type: ["string", "null"]
        currentStreak:
          type: integer
        lastStreakDate:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserProfileInput:
      type: object
      required:
        - name
        - age
        - gender
        - heightCm
        - currentWeightKg
        - goalWeightKg
        - bodyType
        - goals
        - fitnessLevel
        - gymAccess
        - workoutDaysPerWeek
        - commitmentLevel
        - wakeTime
        - sleepTime
      properties:
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
        heightCm:
          type: number
        currentWeightKg:
          type: number
        goalWeightKg:
          type: number
        bodyType:
          type: string
        goals:
          type: array
          items:
            type: string
        targetDate:
          type: string
        fitnessLevel:
          type: string
        gymAccess:
          type: string
        equipment:
          type: string
        workoutDaysPerWeek:
          type: integer
        preferredWorkoutTime:
          type: string
        wakeTime:
          type: string
        sleepTime:
          type: string
        sleepQuality:
          type: integer
        energyLevel:
          type: integer
        stressLevel:
          type: integer
        workSchedule:
          type: string
        averageDailySteps:
          type: integer
        allergies:
          type: string
        dislikedFoods:
          type: string
        dietStyle:
          type: string
        foodBudget:
          type: string
        mealsPerDay:
          type: integer
        waterIntakeLiters:
          type: number
        caffeineUse:
          type: string
        screenTimeBeforeBed:
          type: string
        skinConcerns:
          type: array
          items:
            type: string
        digestionConcerns:
          type: array
          items:
            type: string
        biggestStruggle:
          type: string
        sport:
          type: string
        sportCustom:
          type: string
        sportSchedule:
          type: string
        hasOwnSchedule:
          type: string
        ownSchedule:
          type: string
        customWorkoutSchedule:
          type: string
        workoutFocus:
          type: string
        commitmentLevel:
          type: ["string", "null"]
          enum: ["casual", "serious", "locked_in", "extreme_discipline"]
        wakeTimeRange:
          type: ["string", "null"]
        sleepTimeRange:
          type: ["string", "null"]

    UserProfileUpdate:
      type: object
      properties:
